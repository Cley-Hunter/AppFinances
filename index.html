<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1220"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Meu Controle Financeiro</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

main{max-width:1000px;margin:auto;padding:12px}nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--b)}

@media(min-width:701px){nav button{flex-direction:row;gap:6px;font-size:14px}nav button small{font-size:13px}}

.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}

input,select{background:var(--i);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px;width:100%;font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}label{font-size:12px;color:var(--m)}
button.b{background:var(--a);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.b.s{background:var(--o);color:var(--t);border:1px solid var(--b)}button.x{background:none;border:0;color:var(--r);cursor:pointer;font-size:16px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--o)}.row>.d{flex:1;min-width:0}.row .d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--o);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--a)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ck{width:22px;height:22px;accent-color:var(--g)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--o);font-size:13px}
#md{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:12px}#md.on{display:flex}#md .card{width:min(540px,100%);max-height:92vh;overflow:auto;margin:0}
#pr{display:none}
@media print{@page{margin:12mm}body{background:#fff!important;padding:0}body>*:not(#pr){display:none!important}#pr{display:block;color:#000;font:11px system-ui,sans-serif}#pr table{width:100%;border-collapse:collapse}#pr th,#pr td{border-bottom:1px solid #bbb;padding:4px;text-align:left;font-size:11px;color:#000}#pr th{background:#eee}#pr tr{break-inside:avoid}#pr tbody tr:nth-child(even) td{background:#f1f5f9}#pr thead{display:table-header-group}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div id="top"><header><svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lgH)"/><rect x="14" y="36" width="8" height="14" rx="2" fill="#fff" opacity=".6"/><rect x="28" y="28" width="8" height="22" rx="2" fill="#fff" opacity=".8"/><rect x="42" y="20" width="8" height="30" rx="2" fill="#fff"/><path d="M14 29l13-9 8 4 15-13" fill="none" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Meu Controle Financeiro</b><button id="hs" hidden onclick="sync()"></button><button onclick="bo=!bo;render()" title="Vencimentos">🔔<i id="bn" hidden></i></button><button onclick="theme()" title="Tema claro/escuro">🌓</button></header><nav id="nav"></nav></div><div id="bp"></div><main id="app"></main><div id="pr"></div><div id="md" onclick="if(event.target==this)mdClose()"></div>
<script>
const $=s=>document.getElementById(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fm=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const CAT0=['Salário','Outras receitas','Estorno','Moradia','Financiamento','Contas fixas','Mercado','Alimentação','Transporte','Saúde','Lazer','Educação','Assinaturas','Compras','Impostos','Investimentos','Outros'];
const cats=()=>[...new Set([...CAT0,...(db.cats||[])])].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const KW=[[/uber|99 ?pop|posto|shell|ipiranga|combust|estaciona|sem parar/i,'Transporte'],[/ifood|restaur|lanch|padaria|burger|pizza|cafe|café/i,'Alimentação'],[/mercado|carrefour|assa[ií]|atacad|extra|p[aã]o de a[cç]/i,'Mercado'],[/netflix|spotify|prime|disney|youtube|apple|google|hbo/i,'Assinaturas'],[/farm|drog|hospital|cl[ií]nica|raia|pacheco/i,'Saúde'],[/amazon|mercadolivre|mercado livre|shopee|magalu|americanas|shein/i,'Compras'],[/enel|sabesp|vivo|claro|tim\b|internet|energia|luz|[aá]gua|condom/i,'Contas fixas'],[/escola|curso|faculdade|udemy/i,'Educação']];
const guess=d=>(KW.find(k=>k[0].test(d))||[0,'Outros'])[1];
let db;try{db=JSON.parse(localStorage.getItem('fin'))}catch(e){}
db=db||{contas:[{id:'c1',nome:'Carteira',tipo:'Conta'}],lanc:[],rec:[],skip:[],orc:{}};
db.del=db.del||{};db.orcT=db.orcT||0;db.metas=db.metas||[];db.cats=db.cats||[];db.pag=db.pag||[];let tok=null,tokExp=0,tm;
const store=()=>{try{localStorage.setItem('fin',JSON.stringify(db))}catch(e){alert('Não foi possível salvar neste navegador.')}};
const save=()=>{legacy();const T=Date.now();[...db.lanc,...db.rec,...db.contas,...(db.metas||[]),...(db.pag||[])].forEach(x=>x.t=x.t||T);store();clearTimeout(tm);tm=setTimeout(()=>{if(tok&&Date.now()<tokExp)sync()},3000)};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();let ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),tab='resumo',cf='',imp=[];
const addM=(s,n)=>{const[y,m]=s.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const diff=(a,b)=>{const[x,y]=a.split('-').map(Number),[p,q]=b.split('-').map(Number);return(p-x)*12+q-y};
const dIn=(s,dia)=>{const[y,m]=s.split('-').map(Number);return s+'-'+String(Math.min(dia,new Date(y,m,0).getDate())).padStart(2,'0')};
const mname=s=>{const[y,m]=s.split('-');return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const num=s=>{s=String(s).replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const pdate=s=>{s=s.trim();let m;if(m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/))return`${m[3]}-${m[2]}-${m[1]}`;if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[0];if(m=s.match(/^(\d{4})(\d{2})(\d{2})/))return`${m[1]}-${m[2]}-${m[3]}`;return null};
function gen(m){let ch=0;db.rec.forEach(r=>{if(m<r.inicio||(r.fim&&m>r.fim))return;const n=diff(r.inicio,m)+1;if(r.parcelas&&n>r.parcelas)return;const ref=r.id+'|'+m;if(db.skip.includes(ref)||db.lanc.some(l=>l.ref===ref))return;db.lanc.push({id:'g'+ref,data:dIn(m,r.dia),tipo:r.tipo,cat:r.cat,desc:r.desc+(r.parcelas?` (${n}/${r.parcelas})`:''),valor:r.valor,conta:r.conta,pago:!!db.inicio&&m<db.inicio,ref,rec:r.id});ch=1});if(ch)save()}
const opt=(a,s)=>a.map(x=>`<option${x==s?' selected':''}>${E(x)}</option>`).join('');
const contasOpt=s=>db.contas.map(c=>`<option value="${c.id}"${c.id==s?' selected':''}>${E(c.nome)}</option>`).join('');
const cn=id=>(db.contas.find(c=>c.id==id)||{nome:'?'}).nome;
const sum=a=>a.reduce((s,l)=>s+l.valor,0);
const TABS=[['resumo','Resumo','🏠'],['dash','Dashboard','📊'],['lanc','Lançar','🧾'],['rec','Fixas','🔁'],['cart','Cartões','💳'],['ext','Extrato','📄'],['meta','Metas','🎯'],['imp','Importar','📥'],['bkp','Backup','💾'],['conta','Conta','☁️']];
function go(t){tab=t;render();if(t=='lanc'&&matchMedia('(hover:hover)').matches)setTimeout(()=>$('lv')&&$('lv').focus(),50)}function nav(n){ym=addM(ym,n);render()}
function monthBar(){return`<div class="hd"><button class="b s" onclick="nav(-1)">‹</button><span style="text-align:center"><b style="text-transform:capitalize">${mname(ym)}</b>${ym!=CUR?` <button class="b s" onclick="ym=CUR;render()">↩ Mês atual</button>`:''}</span><button class="b s" onclick="nav(1)">›</button></div>`}
function item(l,showConta=1){return`<div class="row"><input type="checkbox" class="ck" ${l.pago?'checked':''} onchange="tog('${l.id}')" title="Pago / recebido"><div class="d"><b>${E(l.desc)}</b><span class="m">${l.data.split('-').reverse().join('/')} · ${E(l.cat)}${showConta?' · '+E(cn(l.conta)):''}</span></div><b class="${l.tipo=='R'?'g':'r'}">${l.tipo=='R'?'+':'-'}${fm(l.valor)}</b><button class="x" style="color:var(--m)" onclick="edit('${l.id}')">✎</button><button class="x" onclick="del('${l.id}')">✕</button></div>`}
function render(){
 if(locked){$('nav').innerHTML='';$('bp').className='';$('bn').hidden=true;$('hs').hidden=true;$('app').innerHTML=lockScr();return}
 if(!user&&!localStorage.getItem('fin_local')){$('nav').innerHTML='';$('app').innerHTML=loginScr();return}
 $('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[2]}<small>${t[1]}</small></button>`).join('');
 gen(ym);const L=db.lanc.filter(l=>l.data.startsWith(ym)).sort((a,b)=>a.data<b.data?-1:1),R=sum(L.filter(l=>l.tipo=='R'&&!isEst(l))),D=sum(L.filter(l=>l.tipo=='D'))-sum(L.filter(isEst)),pend=sum(L.filter(l=>l.tipo=='D'&&!l.pago));let h='';
 if(tab=='resumo'){const bc={};L.filter(l=>l.tipo=='D').forEach(l=>bc[l.cat]=(bc[l.cat]||0)+l.valor);const mx=Math.max(1,...Object.values(bc));
  const acum=sum(db.lanc.filter(l=>l.data.slice(0,7)<=ym&&l.data.slice(0,7)>=(db.inicio||'0000-00')&&l.pago&&l.tipo=='R'))-sum(db.lanc.filter(l=>l.data.slice(0,7)<=ym&&l.data.slice(0,7)>=(db.inicio||'0000-00')&&l.pago&&l.tipo=='D'));
  h=monthBar()+`<div class="grid"><div class="card"><div class="m">Receitas</div><div class="big g">${fm(R)}</div></div><div class="card"><div class="m">Despesas</div><div class="big r">${fm(D)}</div></div><div class="card"><div class="m">Saldo do mês</div><div class="big ${R-D<0?'r':'g'}">${fm(R-D)}</div></div><div class="card"><div class="m">A pagar no mês</div><div class="big">${fm(pend)}</div></div><div class="card"><div class="m">Caixa realizado (acumulado)</div><div class="big">${fm(acum)}</div></div></div>
  <div class="card"><b>Gastos por categoria</b> <span class="m">(toque para definir limite)</span>${Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const lim=db.orc[c],p=lim?v/lim*100:v/mx*100;return`<div style="margin-top:10px;cursor:pointer" onclick="setOrc('${E(c)}')"><div style="display:flex;justify-content:space-between"><span>${E(c)}</span><span class="${lim&&v>lim?'r':''}">${fm(v)}${lim?' / '+fm(lim):''}</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;${lim&&v>lim?'background:var(--r)':''}"></i></div></div>`}).join('')||'<p class="m">Sem despesas neste mês.</p>'}</div>`+projCard()}
 if(tab=='meta')h=metaHtml();
 if(tab=='ext')h=extHtml();
 if(tab=='dash')h=monthBar()+dashHtml(L);
 if(tab=='lanc')h=monthBar()+`<div class="card"><div class="f" onkeydown="fk(event)"><div><label>Tipo</label><select id="lt"><option value="D">Despesa</option><option value="R">Receita</option></select></div><div><label>Valor (total)</label><input id="lv" inputmode="decimal" placeholder="0,00"></div><div><label>Descrição</label><input id="ls" list="dl" autocomplete="off" onchange="auto()" placeholder="ou toque em 🎤"><datalist id="dl">${dlist()}</datalist></div><div><label>Categoria</label><div style="display:flex;gap:4px"><select id="lc">${opt(cats())}</select><button class="b s" type="button" onclick="newCat('lc')" title="Nova categoria">＋</button></div></div><div><label>Conta / cartão</label><select id="la">${contasOpt()}</select></div><div><label>Data</label><input id="ld" type="date" value="${ds(new Date())}"></div><div><label>Parcelas</label><input id="lp" type="number" min="1" value="1"></div><p id="vz" class="m" style="grid-column:1/-1;margin:0">⌨️ Enter avança para o próximo campo e, no último, salva. Depois de salvar o cursor volta ao Valor.</p><button class="b" onclick="add()">Adicionar</button><button class="b s" onclick="voz()">🎤 Falar</button><button class="b s" onclick="voz(1)">⌨️ Frase</button></div></div><div class="card"><div style="display:flex;gap:8px;margin-bottom:6px"><input placeholder="🔍 Buscar neste mês…" value="${E(q)}" oninput="q=this.value;$('ll').innerHTML=lanList()"><button class="b s" style="white-space:nowrap" onclick="ef.conta='';ef.de=ym+'-01';ef.ate=dIn(ym,31);ef.tipo='';ef.nat='';ef.st='';ef.q='';tab='ext';render()">📄 Extrato</button></div><div id="ll">${lanList()}</div></div>`;
 if(tab=='rec')h=`<div class="card"><b>Lançamentos recorrentes</b><p class="m">Cadastre uma vez: salário, financiamento (com nº de parcelas), luz, condomínio… Eles entram automaticamente todo mês.</p><div class="f"><div><label>Tipo</label><select id="rt"><option value="D">Despesa</option><option value="R">Receita</option></select></div><div><label>Descrição</label><input id="rs" placeholder="Ex.: Financiamento carro"></div><div><label>Categoria</label><select id="rc">${opt(cats())}</select></div><div><label>Valor mensal</label><input id="rv" inputmode="decimal"></div><div><label>Dia do mês</label><input id="rd" type="number" min="1" max="31" value="5"></div><div><label>Conta / cartão</label><select id="ra">${contasOpt()}</select></div><div><label>Início</label><input id="ri" type="month" value="${ym}"></div><div><label>Nº parcelas (0 = sem fim)</label><input id="rp" type="number" min="0" value="0"></div><div><label>Fim (opcional)</label><input id="rf" type="month"></div><button class="b" onclick="addRec()">Salvar</button></div></div><div class="card">${recList()}</div>`;
 if(tab=='cart'){const sel=cf||db.contas[0].id,c0=db.contas.find(x=>x.id==sel)||db.contas[0],cfg=isCard(c0),LL=cfg?db.lanc.filter(l=>l.conta==c0.id&&invKey(l)==ym).sort((a,b)=>a.data<b.data?-1:1):L.filter(l=>l.conta==c0.id),pend=LL.filter(l=>!l.pago);
  h=monthBar()+`<div class="card"><div class="f"><div><label>Nome</label><input id="cnm" placeholder="Ex.: Nubank"></div><div><label>Tipo</label><select id="cty"><option>Cartão</option><option>Conta</option></select></div><div><label>Limite</label><input id="cl" inputmode="decimal"></div><div><label>Fechamento (dia)</label><input id="cf2" type="number" min="1" max="31"></div><div><label>Vencimento (dia)</label><input id="cv" type="number" min="1" max="31"></div><button class="b" onclick="addConta()">Adicionar</button></div></div><div class="grid">${db.contas.map(c=>ctaCard(c,sel)).join('')}</div><div class="card"><div class="hd"><b>${E(c0.nome)}</b><span><button class="b s" onclick="contaEd('${c0.id}')">✎ Editar</button> <button class="b s" onclick="ef.conta='${c0.id}';ef.de='';ef.ate='';tab='ext';render()">Extrato</button></span></div>${cfg?`<p class="m">Fatura que fecha em <b>${dmy(invClose(c0,ym))}</b> e vence em <b>${dmy(invDue(c0,ym))}</b>: <b>${fm(tot(LL))}</b> ${pend.length?`<button class="b" onclick="payInv('${c0.id}','${ym}')">Pagar fatura</button>`:'· ✅ paga'}</p>`:c0.tipo=='Cartão'?'<p class="m">Informe fechamento e vencimento (✎ Editar) para ver faturas, limite e avisos de vencimento.</p>':''}${LL.map(l=>item(l,0)).join('')||'<p class="m">Sem movimentos.</p>'}</div>`}
