<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1220"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Meu Controle Financeiro</title>
<style>
:root{--bg:#0b1220;--p:#0f172a;--i:#111827;--b:#334155;--t:#e5e7eb;--m:#94a3b8;--a:#2563eb;--g:#22c55e;--r:#ef4444;--n:#172033;--o:#1e293b;--s:#1e3a5f;color-scheme:dark}
:root[data-theme=light]{--bg:#f1f5f9;--p:#fff;--i:#fff;--b:#cbd5e1;--t:#0f172a;--m:#64748b;--g:#16a34a;--r:#dc2626;--n:#e2e8f0;--o:#e2e8f0;--s:#dbeafe;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{position:sticky;top:0;z-index:6}header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--b)}
header img{width:32px;height:32px;border-radius:8px}header b{flex:1;font-size:16px}
header button{position:relative;background:var(--n);color:var(--t);border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:15px}
#bn{position:absolute;top:-5px;right:-5px;background:var(--r);color:#fff;border-radius:10px;font:700 11px sans-serif;padding:2px 6px}
#bp{display:none;position:fixed;top:58px;right:8px;width:min(380px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:12px;padding:12px;box-shadow:0 10px 30px #0006;z-index:9}#bp.on{display:block}
main{max-width:1000px;margin:auto;padding:12px}nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--b)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;background:var(--n);color:var(--m);border:0;padding:7px 12px;border-radius:10px;font-size:18px;cursor:pointer}nav button small{font-size:10px;font-weight:700}nav button.on{background:var(--s);color:var(--a)}
@media(min-width:701px){nav button{flex-direction:row;gap:6px;font-size:14px}nav button small{font-size:13px}}
@media(max-width:700px){nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--b);border-bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}nav button{flex:1;min-width:64px}main{padding-bottom:96px}#bp{top:54px}}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.big{font-size:20px;font-weight:800}.m{color:var(--m);font-size:13px}.g{color:var(--g)}.r{color:var(--r)}
input,select{background:var(--i);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px;width:100%;font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}label{font-size:12px;color:var(--m)}
button.b{background:var(--a);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.b.s{background:var(--o);color:var(--t);border:1px solid var(--b)}button.x{background:none;border:0;color:var(--r);cursor:pointer;font-size:16px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--o)}.row>.d{flex:1;min-width:0}.row .d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--o);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--a)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ck{width:22px;height:22px;accent-color:var(--g)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--o);font-size:13px}
#pr{display:none}
@media print{@page{margin:12mm}body{background:#fff!important;padding:0}body>*:not(#pr){display:none!important}#pr{display:block;color:#000;font:11px system-ui,sans-serif}#pr table{width:100%;border-collapse:collapse}#pr th,#pr td{border-bottom:1px solid #bbb;padding:4px;text-align:left;font-size:11px;color:#000}#pr th{background:#eee}#pr tr{break-inside:avoid}}
</style></head><body>
<div id="top"><header><svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lgH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lgH)"/><rect x="14" y="36" width="8" height="14" rx="2" fill="#fff" opacity=".6"/><rect x="28" y="28" width="8" height="22" rx="2" fill="#fff" opacity=".8"/><rect x="42" y="20" width="8" height="30" rx="2" fill="#fff"/><path d="M14 29l13-9 8 4 15-13" fill="none" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Meu Controle Financeiro</b><button id="hs" hidden onclick="sync()"></button><button onclick="bo=!bo;render()" title="Vencimentos">🔔<i id="bn" hidden></i></button><button onclick="theme()" title="Tema claro/escuro">🌓</button></header><nav id="nav"></nav></div><div id="bp"></div><main id="app"></main><div id="pr"></div>
<script>
const $=s=>document.getElementById(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fm=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const CATS=['Salário','Outras receitas','Moradia','Financiamento','Contas fixas','Mercado','Alimentação','Transporte','Saúde','Lazer','Educação','Assinaturas','Compras','Impostos','Investimentos','Outros'];
const KW=[[/uber|99 ?pop|posto|shell|ipiranga|combust|estaciona|sem parar/i,'Transporte'],[/ifood|restaur|lanch|padaria|burger|pizza|cafe|café/i,'Alimentação'],[/mercado|carrefour|assa[ií]|atacad|extra|p[aã]o de a[cç]/i,'Mercado'],[/netflix|spotify|prime|disney|youtube|apple|google|hbo/i,'Assinaturas'],[/farm|drog|hospital|cl[ií]nica|raia|pacheco/i,'Saúde'],[/amazon|mercadolivre|mercado livre|shopee|magalu|americanas|shein/i,'Compras'],[/enel|sabesp|vivo|claro|tim\b|internet|energia|luz|[aá]gua|condom/i,'Contas fixas'],[/escola|curso|faculdade|udemy/i,'Educação']];
const guess=d=>(KW.find(k=>k[0].test(d))||[0,'Outros'])[1];
let db;try{db=JSON.parse(localStorage.getItem('fin'))}catch(e){}
db=db||{contas:[{id:'c1',nome:'Carteira',tipo:'Conta'}],lanc:[],rec:[],skip:[],orc:{}};
db.del=db.del||{};db.orcT=db.orcT||0;db.metas=db.metas||[];let tok=null,tokExp=0,tm;
const store=()=>{try{localStorage.setItem('fin',JSON.stringify(db))}catch(e){alert('Não foi possível salvar neste navegador.')}};
const save=()=>{const T=Date.now();[...db.lanc,...db.rec,...db.contas,...(db.metas||[])].forEach(x=>x.t=x.t||T);store();clearTimeout(tm);tm=setTimeout(()=>{if(tok&&Date.now()<tokExp)sync()},3000)};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();let ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),tab='resumo',cf='',imp=[];
const addM=(s,n)=>{const[y,m]=s.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const diff=(a,b)=>{const[x,y]=a.split('-').map(Number),[p,q]=b.split('-').map(Number);return(p-x)*12+q-y};
const dIn=(s,dia)=>{const[y,m]=s.split('-').map(Number);return s+'-'+String(Math.min(dia,new Date(y,m,0).getDate())).padStart(2,'0')};
const mname=s=>{const[y,m]=s.split('-');return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const num=s=>{s=String(s).replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const pdate=s=>{s=s.trim();let m;if(m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/))return`${m[3]}-${m[2]}-${m[1]}`;if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[0];if(m=s.match(/^(\d{4})(\d{2})(\d{2})/))return`${m[1]}-${m[2]}-${m[3]}`;return null};
function gen(m){let ch=0;db.rec.forEach(r=>{if(m<r.inicio)return;const n=diff(r.inicio,m)+1;if(r.parcelas&&n>r.parcelas)return;const ref=r.id+'|'+m;if(db.skip.includes(ref)||db.lanc.some(l=>l.ref===ref))return;db.lanc.push({id:'g'+ref,data:dIn(m,r.dia),tipo:r.tipo,cat:r.cat,desc:r.desc+(r.parcelas?` (${n}/${r.parcelas})`:''),valor:r.valor,conta:r.conta,pago:false,ref,rec:r.id});ch=1});if(ch)save()}
const opt=(a,s)=>a.map(x=>`<option${x==s?' selected':''}>${E(x)}</option>`).join('');
const contasOpt=s=>db.contas.map(c=>`<option value="${c.id}"${c.id==s?' selected':''}>${E(c.nome)}</option>`).join('');
const cn=id=>(db.contas.find(c=>c.id==id)||{nome:'?'}).nome;
const sum=a=>a.reduce((s,l)=>s+l.valor,0);
const TABS=[['resumo','Resumo','🏠'],['dash','Dashboard','📊'],['lanc','Lançar','🧾'],['rec','Fixas','🔁'],['cart','Cartões','💳'],['ext','Extrato','📄'],['meta','Metas','🎯'],['imp','Importar','📥'],['bkp','Backup','💾'],['conta','Conta','☁️']];
function go(t){tab=t;render()}function nav(n){ym=addM(ym,n);render()}
function monthBar(){return`<div class="hd"><button class="b s" onclick="nav(-1)">‹</button><b style="text-transform:capitalize">${mname(ym)}</b><button class="b s" onclick="nav(1)">›</button></div>`}
function item(l,showConta=1){return`<div class="row"><input type="checkbox" class="ck" ${l.pago?'checked':''} onchange="tog('${l.id}')" title="Pago / recebido"><div class="d"><b>${E(l.desc)}</b><span class="m">${l.data.split('-').reverse().join('/')} · ${E(l.cat)}${showConta?' · '+E(cn(l.conta)):''}</span></div><b class="${l.tipo=='R'?'g':'r'}">${l.tipo=='R'?'+':'-'}${fm(l.valor)}</b><button class="x" style="color:var(--m)" onclick="edit('${l.id}')">✎</button><button class="x" onclick="del('${l.id}')">✕</button></div>`}
function render(){
 if(locked){$('nav').innerHTML='';$('bp').className='';$('bn').hidden=true;$('hs').hidden=true;$('app').innerHTML=lockScr();return}
 if(!user&&!localStorage.getItem('fin_local')){$('nav').innerHTML='';$('app').innerHTML=loginScr();return}
 $('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[2]}<small>${t[1]}</small></button>`).join('');
 gen(ym);const L=db.lanc.filter(l=>l.data.startsWith(ym)).sort((a,b)=>a.data<b.data?-1:1),R=sum(L.filter(l=>l.tipo=='R')),D=sum(L.filter(l=>l.tipo=='D')),pend=sum(L.filter(l=>l.tipo=='D'&&!l.pago));let h='';
 if(tab=='resumo'){const bc={};L.filter(l=>l.tipo=='D').forEach(l=>bc[l.cat]=(bc[l.cat]||0)+l.valor);const mx=Math.max(1,...Object.values(bc));
  const acum=sum(db.lanc.filter(l=>l.data.slice(0,7)<=ym&&l.pago&&l.tipo=='R'))-sum(db.lanc.filter(l=>l.data.slice(0,7)<=ym&&l.pago&&l.tipo=='D'));
  h=monthBar()+`<div class="grid"><div class="card"><div class="m">Receitas</div><div class="big g">${fm(R)}</div></div><div class="card"><div class="m">Despesas</div><div class="big r">${fm(D)}</div></div><div class="card"><div class="m">Saldo do mês</div><div class="big ${R-D<0?'r':'g'}">${fm(R-D)}</div></div><div class="card"><div class="m">A pagar no mês</div><div class="big">${fm(pend)}</div></div><div class="card"><div class="m">Caixa realizado (acumulado)</div><div class="big">${fm(acum)}</div></div></div>
  <div class="card"><b>Gastos por categoria</b> <span class="m">(toque para definir limite)</span>${Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const lim=db.orc[c],p=lim?v/lim*100:v/mx*100;return`<div style="margin-top:10px;cursor:pointer" onclick="setOrc('${E(c)}')"><div style="display:flex;justify-content:space-between"><span>${E(c)}</span><span class="${lim&&v>lim?'r':''}">${fm(v)}${lim?' / '+fm(lim):''}</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;${lim&&v>lim?'background:var(--r)':''}"></i></div></div>`}).join('')||'<p class="m">Sem despesas neste mês.</p>'}</div>`+projCard()}
 if(tab=='meta')h=metaHtml();
 if(tab=='ext')h=extHtml();
 if(tab=='dash')h=monthBar()+dashHtml(L,R,D);
 if(tab=='lanc')h=monthBar()+`<div class="card"><div class="f"><div><label>Tipo</label><select id="lt"><option value="D">Despesa</option><option value="R">Receita</option></select></div><div><label>Data</label><input id="ld" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Descrição</label><input id="ls" placeholder="ou toque em 🎤: gastei 45 no mercado"></div><div><label>Categoria</label><select id="lc">${opt(CATS)}</select></div><div><label>Valor total</label><input id="lv" inputmode="decimal" placeholder="0,00"></div><div><label>Conta / cartão</label><select id="la">${contasOpt()}</select></div><div><label>Parcelas</label><input id="lp" type="number" min="1" value="1"></div><p id="vz" class="m" style="grid-column:1/-1;margin:0"></p><button class="b s" onclick="voz()">🎤 Falar</button><button class="b s" onclick="voz(1)">⌨️ Frase</button><button class="b" onclick="add()">${editId?'Salvar alteração':'Adicionar'}</button>${editId?'<button class="b s" onclick="editId=null;render()">Cancelar</button>':''}</div></div><div class="card"><input placeholder="🔍 Buscar neste mês…" value="${E(q)}" oninput="q=this.value;$('ll').innerHTML=lanList()"><div id="ll">${lanList()}</div></div>`;
 if(tab=='rec')h=`<div class="card"><b>Lançamentos recorrentes</b><p class="m">Cadastre uma vez: salário, financiamento (com nº de parcelas), luz, condomínio… Eles entram automaticamente todo mês.</p><div class="f"><div><label>Tipo</label><select id="rt"><option value="D">Despesa</option><option value="R">Receita</option></select></div><div><label>Descrição</label><input id="rs" placeholder="Ex.: Financiamento carro"></div><div><label>Categoria</label><select id="rc">${opt(CATS)}</select></div><div><label>Valor mensal</label><input id="rv" inputmode="decimal"></div><div><label>Dia do mês</label><input id="rd" type="number" min="1" max="31" value="5"></div><div><label>Conta / cartão</label><select id="ra">${contasOpt()}</select></div><div><label>Início</label><input id="ri" type="month" value="${ym}"></div><div><label>Nº parcelas (0 = sem fim)</label><input id="rp" type="number" min="0" value="0"></div><button class="b" onclick="addRec()">Salvar</button></div></div><div class="card">${db.rec.map(r=>`<div class="row"><div class="d"><b>${E(r.desc)}</b><span class="m">dia ${r.dia} · ${E(r.cat)} · desde ${r.inicio}${r.parcelas?' · '+r.parcelas+'x':' · sem fim'}</span></div><b class="${r.tipo=='R'?'g':'r'}">${fm(r.valor)}</b><button class="x" onclick="delRec('${r.id}')">✕</button></div>`).join('')||'<p class="m">Nada cadastrado.</p>'}</div>`;
 if(tab=='cart'){const sel=cf||db.contas[0].id,LL=L.filter(l=>l.conta==sel);h=monthBar()+`<div class="card"><div class="f"><div><label>Nome</label><input id="cnm" placeholder="Ex.: Nubank, Itaú Visa"></div><div><label>Tipo</label><select id="cty"><option>Cartão</option><option>Conta</option></select></div><button class="b" onclick="addConta()">Adicionar</button></div></div><div class="grid">${db.contas.map(c=>`<div class="card" style="cursor:pointer;${c.id==sel?'border-color:var(--a)':''}" onclick="cf='${c.id}';render()"><div class="m">${E(c.tipo=='Cartão'?'Fatura · ':'')}${E(c.nome)}</div><div class="big">${fm(sum(L.filter(l=>l.conta==c.id&&l.tipo=='D')))}</div></div>`).join('')}</div><div class="card"><b>${E(cn(sel))}</b> <button class="b s" onclick="ef.conta='${sel}';ef.de='';ef.ate='';tab='ext';render()">Ver extrato completo</button>${LL.map(l=>item(l,0)).join('')||'<p class="m">Sem movimentos neste mês.</p>'}</div>`}
 if(tab=='imp')h=`<div class="card"><b>Importar fatura ou extrato</b><p class="m">Aceita CSV (Nubank, Inter, C6…) e OFX (Itaú, Bradesco, BB…). As categorias são sugeridas automaticamente e você revisa antes de confirmar. Duplicados são desmarcados.</p><div class="f"><div><label>Arquivo</label><input type="file" id="fi" accept=".csv,.ofx,.txt" onchange="readF(this)"></div><div><label>Lançar em</label><select id="ia">${contasOpt(db.contas.find(c=>c.tipo=='Cartão')?.id)}</select></div><div><label>Nos CSV, valor positivo é…</label><select id="im"><option value="pos">gasto (fatura de cartão)</option><option value="neg">entrada (extrato de conta)</option></select></div></div></div>${imp.length?`<div class="card sc"><table><tr><th></th><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr>${imp.map((x,i)=>`<tr><td><input type="checkbox" class="ck" ${x.inc?'checked':''} onchange="imp[${i}].inc=this.checked"></td><td>${x.data.split('-').reverse().join('/')}</td><td>${E(x.desc)}</td><td><select onchange="imp[${i}].cat=this.value">${opt(CATS,x.cat)}</select></td><td class="${x.tipo=='R'?'g':'r'}">${fm(x.valor)}</td></tr>`).join('')}</table><p><button class="b" onclick="confirmImp()">Importar selecionados</button></p></div>`:''}`;
 if(tab=='conta')h=`<div class="card"><b>Conta e sincronização</b>${user?`<p>Conectado como <b>${E(user.name)}</b><br><span class="m">${E(user.email)}</span></p><p><button class="b" onclick="sync()">Sincronizar agora</button> <button class="b s" onclick="logout()">Sair</button></p>`:`<p class="m">Modo local: dados somente neste aparelho.</p><p><button class="b" onclick="gAuth(sync)">Entrar com Google e ativar sincronização</button></p>`}<p class="m">Os dados vão para a pasta oculta do app no seu Google Drive (escopo drive.appdata), sem acesso aos seus outros arquivos. Quando conectado, sincroniza sozinho 3 segundos após cada alteração. Conflitos são resolvidos por registro (vale a alteração mais recente).</p></div><div class="card"><b>🔒 PIN de bloqueio</b><p class="m">Pede o PIN ao abrir o app e após 30 segundos fora da tela. Impede o acesso casual; os dados no aparelho não são criptografados.</p><p><button class="b" onclick="setPin()">${localStorage.getItem('fin_pin')?'Alterar PIN':'Definir PIN'}</button> ${localStorage.getItem('fin_pin')?'<button class="b s" onclick="rmPin()">Remover PIN</button>':''}</p></div><div class="card"><b>🤖 Assistente de IA para lançamentos</b><p class="m">Opcional: entende frases faladas fora de ordem. Crie uma chave gratuita no Google AI Studio (aistudio.google.com) e cole abaixo. A chave fica só neste aparelho. A frase falada e os nomes das suas categorias e contas são enviados ao Google; confira os termos do plano gratuito. Sem chave, o app usa o modo local melhorado, que funciona offline.</p><div class="f"><div><label>Chave da API (Gemini)</label><input id="aik" type="password" value="${E(localStorage.getItem('fin_ai')||'')}"></div><div><label>Modelo</label><input id="aim" value="${E(localStorage.getItem('fin_aim')||'gemini-2.5-flash')}"></div><button class="b" onclick="saveAI()">Salvar</button></div></div>`;
 if(tab=='bkp')h=`<div class="card"><b>Backup e dados</b><p class="m">Os dados ficam salvos neste aparelho. Use o backup JSON para levar tudo do Windows para o Android (e vice-versa).</p><p><button class="b" onclick="expJ()">Baixar backup (.json)</button> <button class="b s" onclick="expC()">Exportar CSV</button></p><label>Restaurar backup</label><input type="file" accept=".json" onchange="impJ(this)"><p><button class="b s" onclick="if(confirm('Apagar TODOS os dados?')){localStorage.removeItem('fin');location.reload()}">Apagar tudo</button></p></div>`;
 $('app').innerHTML=h;bell();$('bp').className=bo?'on':'';$('hs').hidden=!user;$('hs').textContent='☁ '+syncSt}
function add(){const v=num($('lv').value),n=+$('lp').value||1,d=$('ld').value,s=$('ls').value.trim();if(!(v>0)||!d||!s)return alert('Preencha data, descrição e valor.');if(editId){const l=db.lanc.find(x=>x.id==editId);Object.assign(l,{tipo:$('lt').value,data:d,desc:s,cat:$('lc').value,valor:v,conta:$('la').value,t:0});editId=null;save();render();return}const each=Math.round(v/n*100)/100;

async function setPin(){if(localStorage.getItem('fin_pin')&&!await chk('Digite o PIN atual:'))return;const a=prompt('Novo PIN (4 a 8 números):');if(!a)return;if(!/^\d{4,8}$/.test(a))return alert('O PIN deve ter de 4 a 8 números.');if(prompt('Repita o PIN:')!==a)return alert('Os PINs não conferem.');localStorage.setItem('fin_pin',await sha(a));alert('PIN ativado.');render()}

function sim(a,p,ra,alvo){const i=Math.pow(1+ra/100,1/12)-1;let s=a,n=0;while(s<alvo&&n<1200){s=s*(1+i)+p;n++}return s>=alvo?n:null}
function pmt(a,alvo,ra,n){const i=Math.pow(1+ra/100,1/12)-1;return i?(alvo-a*Math.pow(1+i,n))*i/(Math.pow(1+i,n)-1):(alvo-a)/n}

function simInv(){const v=num($('sv').value)||0,a=num($('sa').value)||0,t=num($('st').value)||0,y=+$('sy').value||1,n=y*12,i=Math.pow(1+t/100,1/12)-1;let s=v,inv=v;const P=[v],Q=[v];for(let k=1;k<=n;k++){s=s*(1+i)+a;inv+=a;P.push(s);Q.push(inv)}const g=s-inv,d=n*30,ir=$('si').checked?g*(d>720?.15:d>360?.175:d>180?.2:.225):0,mx=Math.max(s,1),pl=(A,c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" points="${A.map((z,k)=>(k/n*360).toFixed(1)+','+(120-z/mx*115).toFixed(1)).join(' ')}"/>`,k=(l,x,c='')=>`<div class="card"><div class="m">${l}</div><div class="big ${c}">${fm(x)}</div></div>`;
 $('sr').innerHTML=`<div class="grid" style="margin-top:10px">${k('Total investido',inv)}${k('Rendimento bruto',g,'g')}${k('IR estimado',ir,'r')}${k('Valor final líquido',s-ir)}</div><svg viewBox="0 0 360 125" width="100%">${pl(Q,'var(--m)',2)}${pl(P,'var(--g)',3)}</svg><div class="m">Verde: patrimônio · cinza: total aportado</div>`}
function metaHtml(){return`<div class="card"><b>🎯 Nova meta</b><div class="f" style="margin-top:8px"><div><label>Nome</label><input id="mn" placeholder="Reserva de emergência"></div><div><label>Valor alvo</label><input id="ma" inputmode="decimal"></div><div><label>Já guardado</label><input id="mt" inputmode="decimal" value="0"></div><div><label>Aporte mensal</label><input id="mp" inputmode="decimal" value="0"></div><div><label>Rendimento % a.a.</label><input id="mr" inputmode="decimal" value="0"></div><div><label>Prazo (opcional)</label><input id="mz" type="month"></div><button class="b" onclick="addMeta()">Criar meta</button></div></div>`+db.metas.map(m=>{const p=Math.min(100,m.atual/m.alvo*100),n=sim(m.atual,m.aporte,m.rend,m.alvo),k=m.prazo?diff(CUR,m.prazo):0;return`<div class="card"><div class="hd"><b>${E(m.nome)}</b><span><button class="b s" onclick="aporte('${m.id}')">+ Aporte</button> <button class="x" onclick="delMeta('${m.id}')">✕</button></span></div><div>${fm(m.atual)} <span class="m">de ${fm(m.alvo)} · ${p.toFixed(0)}%</span></div><div class="bar"><i style="width:${p}%;background:var(--g)"></i></div><p class="m">${m.atual>=m.alvo?'🎉 Meta atingida!':n===null?'Com o aporte e rendimento atuais a meta não é atingida em 100 anos.':`Previsão: <b>${n} meses</b> (${mname(addM(CUR,n))}) com ${fm(m.aporte)}/mês a ${m.rend}% a.a.`}${k>0&&m.atual<m.alvo?`<br>Para chegar em ${mname(m.prazo)}: guardar <b>${fm(Math.max(0,pmt(m.atual,m.alvo,m.rend,k)))}</b>/mês.`:''}</p></div>`}).join('')+simHtml()}
function pdfExt(){const a=extF(),ant=ef.de?db.lanc.filter(l=>(!ef.conta||l.conta==ef.conta)&&l.data<ef.de).reduce((s,l)=>s+sg(l),0):0;let s=ant;const en=sum(a.filter(l=>l.tipo=='R')),sa=sum(a.filter(l=>l.tipo=='D'));
 if(!a.length)return alert('Nenhuma movimentação no filtro atual.');

const NW={zero:0,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900};
const n1=s=>[...s].map(c=>c.normalize('NFD')[0]).join('').toLowerCase();
function w2n(N,O){const n=[],o=[],um=(w,x)=>(w=='um'||w=='uma')&&/^(mil|real|reais)$/.test(x||''),isN=(w,x)=>w in NW||w=='mil'||um(w,x);
 for(let i=0;i<N.length;i++){if(N[i]=='mil'&&n.length&&/^\d+$/.test(n[n.length-1])){n[n.length-1]=o[o.length-1]=String(n[n.length-1]*1000);continue}if(isN(N[i],N[i+1])){let tot=0,cur=0,j=i;for(;j<N.length;j++){const w=N[j];if(w in NW)cur+=NW[w];else if(w=='mil'){tot+=(cur||1)*1000;cur=0}else if(um(w,N[j+1])||(cur>0&&N[j-1]=='e'&&(w=='um'||w=='uma')))cur+=1;else if(w=='e'&&j>i&&isN(N[j+1],N[j+2])&&isN(N[j-1],N[j]))continue;else break}n.push(String(tot+cur));o.push(String(tot+cur));i=j-1}else{n.push(N[i]);o.push(O[i])}}return[n,o]}
const nv=s=>num(/^\d{1,3}(\.\d{3})+/.test(s)?s.replace(/\./g,''):s);
function vozLocal(t){let O=t.trim().split(/\s+/),N=O.map(n1);[N,O]=w2n(N,O);const used=N.map(()=>0);let S=N.join(' ');
 const eat=(re,mm)=>{const m=mm||S.match(re);if(!m)return null;const a=S.slice(0,m.index).split(' ').length-1,b=a+m[0].split(' ').length-1;for(let i=a;i<=b;i++)used[i]=1;S=S.slice(0,m.index)+m[0].replace(/[^ ]/g,'_')+S.slice(m.index+m[0].length);return m};
 const d=new Date();let m;
 if(eat(/\banteontem\b/))d.setDate(d.getDate()-2);else if(eat(/\bontem\b/))d.setDate(d.getDate()-1);else if(m=eat(/\bdia (\d{1,2})\b/))d.setDate(+m[1]);else if(m=eat(/\b(segunda|terca|quarta|quinta|sexta|sabado|domingo)\b(?: feira)?(?: passad[ao])?/)){const w=['domingo','segunda','terca','quarta','quinta','sexta','sabado'].indexOf(m[1]);d.setDate(d.getDate()-((d.getDay()-w+7)%7))}
 eat(/\bhoje\b/);
 m=eat(/\b(?:parcelad[oa] )?(?:em )?(\d{1,2}) ?(?:x|vezes|parcelas)\b/);const np=m?+m[1]:1;
 let best=null;for(const x of S.matchAll(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)( mil)?( (?:reais|real)(?: e (\d{1,2})(?: centavos)?)?)?/g)){if(!best||(x[3]&&!best[3]))best=x}
 let v=NaN;if(best){v=nv(best[1])*(best[2]?1000:1)+(best[4]?+best[4]/100:0);eat(null,best)}
 let ct='',bl=0;db.contas.forEach(c=>{const k=n1(c.nome);if(k&&S.includes(k)&&k.length>bl){ct=c.id;bl=k.length}});
 if(ct)eat(new RegExp(n1(cn(ct)).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')));else if(/\b(cartao|credito)\b/.test(S)){const c=db.contas.find(c=>c.tipo=='Cartão');if(c)ct=c.id}
 eat(/\b(?:no |na |do |da |pelo |pela )?(?:cartao|credito|debito|conta)\b(?: de credito)?/);
 const rec=/\b(recebi|ganhei|receita|entrou|salario|rendimento|vendi|deposito|reembolso)\b/.test(S);
 while(eat(/\b(recebi|ganhei|gastei|paguei|comprei|passei|vendi|gasto|despesa|receita|entrou)\b/));
 const SW=/^(de|do|da|dos|das|no|na|nos|nas|em|com|para|pra|por|um|uma|o|a|e|foi|fui|reais|real|centavos)$/;let ix=N.map((_,i)=>i).filter(i=>!used[i]);
 while(ix.length&&SW.test(N[ix[0]]))ix.shift();while(ix.length&&SW.test(N[ix[ix.length-1]]))ix.pop();
 let desc=ix.map(i=>O[i]).join(' ');desc=desc?desc[0].toUpperCase()+desc.slice(1):'';
 const tp=rec?'R':'D',dn=n1(desc),h=dn&&[...db.lanc].reverse().find(l=>l.tipo==tp&&n1(l.desc).includes(dn));
 return{tipo:tp,valor:v,data:ds(d),desc,cat:h?h.cat:rec?(/salario/.test(N.join(' '))?'Salário':'Outras receitas'):guess(desc),conta:ct,parc:np}}

async function vozIA(t){const k=localStorage.getItem('fin_ai'),M=localStorage.getItem('fin_aim')||'gemini-2.5-flash',p=`Hoje é ${ds(new Date())} (${new Date().toLocaleDateString('pt-BR',{weekday:'long'})}). Extraia UM lançamento financeiro da frase falada em português, que pode estar fora de ordem ou ter números por extenso. Responda SOMENTE JSON: {"tipo":"R" para receita ou "D" para despesa,"valor":número,"data":"AAAA-MM-DD","descricao":"texto curto","categoria":uma de ${JSON.stringify(CATS)},"conta":uma de ${JSON.stringify(db.contas.map(c=>c.nome))} ou "","parcelas":inteiro}. Frase: "${t}"`;
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+M+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({contents:[{parts:[{text:p}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
 if(!r.ok)throw new Error((await r.text()).slice(0,120));const j=await r.json(),o=JSON.parse(j.candidates[0].content.parts[0].text.replace(/```json|```/g,'')),c=db.contas.find(c=>n1(c.nome)==n1(o.conta||''));
 return{tipo:o.tipo=='R'?'R':'D',valor:+o.valor,data:/^\d{4}-\d{2}-\d{2}$/.test(o.data)?o.data:ds(new Date()),desc:o.descricao||'',cat:CATS.includes(o.categoria)?o.categoria:guess(o.descricao||''),conta:c?c.id:'',parc:Math.max(1,+o.parcelas||1)}}
function saveAI(){const k=$('aik').value.trim();if(k)localStorage.setItem('fin_ai',k);else localStorage.removeItem('fin_ai');localStorage.setItem('fin_aim',$('aim').value.trim()||'gemini-2.5-flash');alert(k?'IA ativada para os lançamentos por voz.':'IA desativada. Usando o modo local.')}
