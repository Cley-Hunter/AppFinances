<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1220"><link rel="icon" href="icon-192.png"><title>Meu Controle Financeiro</title>
<style>
:root{--bg:#0b1220;--p:#0f172a;--i:#111827;--b:#334155;--t:#e5e7eb;--m:#94a3b8;--a:#2563eb;--g:#22c55e;--r:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:980px;margin:auto;padding:12px}nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--p);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;background:#172033;color:var(--m);border:0;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}nav button.on{background:#1e3a5f;color:#60a5fa}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.big{font-size:20px;font-weight:800}.m{color:var(--m);font-size:13px}.g{color:var(--g)}.r{color:var(--r)}
input,select{background:var(--i);color:#f8fafc;border:1px solid var(--b);border-radius:8px;padding:9px;width:100%;font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}label{font-size:12px;color:var(--m)}
button.b{background:var(--a);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.b.s{background:#1e293b;border:1px solid var(--b)}button.x{background:none;border:0;color:var(--r);cursor:pointer;font-size:16px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #1e293b}.row>.d{flex:1;min-width:0}.row .d b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:#1e293b;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--a)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.ck{width:22px;height:22px;accent-color:var(--g)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #1e293b;font-size:13px}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.getElementById(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fm=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const CATS=['Salário','Outras receitas','Moradia','Financiamento','Contas fixas','Mercado','Alimentação','Transporte','Saúde','Lazer','Educação','Assinaturas','Compras','Impostos','Investimentos','Outros'];
const KW=[[/uber|99 ?pop|posto|shell|ipiranga|combust|estaciona|sem parar/i,'Transporte'],[/ifood|restaur|lanch|padaria|burger|pizza|cafe|café/i,'Alimentação'],[/mercado|carrefour|assa[ií]|atacad|extra|p[aã]o de a[cç]/i,'Mercado'],[/netflix|spotify|prime|disney|youtube|apple|google|hbo/i,'Assinaturas'],[/farm|drog|hospital|cl[ií]nica|raia|pacheco/i,'Saúde'],[/amazon|mercadolivre|mercado livre|shopee|magalu|americanas|shein/i,'Compras'],[/enel|sabesp|vivo|claro|tim\b|internet|energia|luz|[aá]gua|condom/i,'Contas fixas'],[/escola|curso|faculdade|udemy/i,'Educação']];
const guess=d=>(KW.find(k=>k[0].test(d))||[0,'Outros'])[1];
let db;try{db=JSON.parse(localStorage.getItem('fin'))}catch(e){}
db=db||{contas:[{id:'c1',nome:'Carteira',tipo:'Conta'}],lanc:[],rec:[],skip:[],orc:{}};
db.del=db.del||{};db.orcT=db.orcT||0;let tok=null,tokExp=0,tm;
const store=()=>{try{localStorage.setItem('fin',JSON.stringify(db))}catch(e){alert('Não foi possível salvar neste navegador.')}};
const save=()=>{const T=Date.now();[...db.lanc,...db.rec,...db.contas].forEach(x=>x.t=x.t||T);store();clearTimeout(tm);tm=setTimeout(()=>{if(tok&&Date.now()<tokExp)sync()},3000)};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();let ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),tab='resumo',cf='',imp=[];
const addM=(s,n)=>{const[y,m]=s.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const diff=(a,b)=>{const[x,y]=a.split('-').map(Number),[p,q]=b.split('-').map(Number);return(p-x)*12+q-y};
const dIn=(s,dia)=>{const[y,m]=s.split('-').map(Number);return s+'-'+String(Math.min(dia,new Date(y,m,0).getDate())).padStart(2,'0')};
const mname=s=>{const[y,m]=s.split('-');return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const num=s=>{s=String(s).replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const pdate=s=>{s=s.trim();let m;if(m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/))return`${m[3]}-${m[2]}-${m[1]}`;if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))return m[0];if(m=s.match(/^(\d{4})(\d{2})(\d{2})/))return`${m[1]}-${m[2]}-${m[3]}`;return null};
function gen(m){let ch=0;db.rec.forEach(r=>{if(m<r.inicio)return;const n=diff(r.inicio,m)+1;if(r.parcelas&&n>r.parcelas)return;const ref=r.id+'|'+m;if(db.skip.includes(ref)||db.lanc.some(l=>l.ref===ref))return;db.lanc.push({id:'g'+ref,data:dIn(m,r.dia),tipo:r.tipo,cat:r.cat,desc:r.desc+(r.parcelas?` (${n}/${r.parcelas})`:''),valor:r.valor,conta:r.conta,pago:false,ref,rec:r.id});ch=1});if(ch)save()}
const opt=(a,s)=>a.map(x=>`<option${x==s?' selected':''}>${E(x)}</option>`).join('');
const contasOpt=s=>db.contas.map(c=>`<option value="${c.id}"${c.id==s?' selected':''}>${E(c.nome)}</option>`).join('');
const cn=id=>(db.contas.find(c=>c.id==id)||{nome:'?'}).nome;
const sum=a=>a.reduce((s,l)=>s+l.valor,0);
const TABS=[['resumo','Resumo'],['lanc','Lançamentos'],['rec','Recorrentes'],['cart','Contas e cartões'],['imp','Importar fatura'],['bkp','Backup'],['conta','Conta e nuvem']];
function go(t){tab=t;render()}function nav(n){ym=addM(ym,n);render()}
function monthBar(){return`<div class="hd"><button class="b s" onclick="nav(-1)">‹</button><b style="text-transform:capitalize">${mname(ym)}</b><button class="b s" onclick="nav(1)">›</button></div>`}
function item(l,showConta=1){return`<div class="row"><input type="checkbox" class="ck" ${l.pago?'checked':''} onchange="tog('${l.id}')" title="Pago / recebido"><div class="d"><b>${E(l.desc)}</b><span class="m">${l.data.split('-').reverse().join('/')} · ${E(l.cat)}${showConta?' · '+E(cn(l.conta)):''}</span></div><b class="${l.tipo=='R'?'g':'r'}">${l.tipo=='R'?'+':'-'}${fm(l.valor)}</b><button class="x" onclick="del('${l.id}')">✕</button></div>`}
function render(){
 if(!user&&!localStorage.getItem('fin_local')){$('nav').innerHTML='';$('app').innerHTML=loginScr();return}
 $('nav').innerHTML=(user?`<button onclick="sync()">☁ ${syncSt}</button>`:'')+TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 gen(ym);const L=db.lanc.filter(l=>l.data.startsWith(ym)).sort((a,b)=>a.data<b.data?-1:1),R=sum(L.filter(l=>l.tipo=='R')),D=sum(L.filter(l=>l.tipo=='D')),pend=sum(L.filter(l=>l.tipo=='D'&&!l.pago));let h='';
 if(tab=='resumo'){const bc={};L.filter(l=>l.tipo=='D').forEach(l=>bc[l.cat]=(bc[l.cat]||0)+l.valor);const mx=Math.max(1,...Object.values(bc));
  const acum=sum(db.lanc.filter(l=>l.data.slice(0,7)<=ym&&l.pago&&l.tipo=='R'))-sum(db.lanc.filter(l=>l.data.slice(0,7)<=ym&&l.pago&&l.tipo=='D'));
  h=monthBar()+`<div class="grid"><div class="card"><div class="m">Receitas</div><div class="big g">${fm(R)}</div></div><div class="card"><div class="m">Despesas</div><div class="big r">${fm(D)}</div></div><div class="card"><div class="m">Saldo do mês</div><div class="big ${R-D<0?'r':'g'}">${fm(R-D)}</div></div><div class="card"><div class="m">A pagar no mês</div><div class="big">${fm(pend)}</div></div><div class="card"><div class="m">Caixa realizado (acumulado)</div><div class="big">${fm(acum)}</div></div></div>
  <div class="card"><b>Gastos por categoria</b> <span class="m">(toque para definir limite)</span>${Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const lim=db.orc[c],p=lim?v/lim*100:v/mx*100;return`<div style="margin-top:10px;cursor:pointer" onclick="setOrc('${E(c)}')"><div style="display:flex;justify-content:space-between"><span>${E(c)}</span><span class="${lim&&v>lim?'r':''}">${fm(v)}${lim?' / '+fm(lim):''}</span></div><div class="bar"><i style="width:${Math.min(100,p)}%;${lim&&v>lim?'background:var(--r)':''}"></i></div></div>`}).join('')||'<p class="m">Sem despesas neste mês.</p>'}</div>`+projCard()}
 if(tab=='lanc')h=monthBar()+`<div class="card"><div class="f"><div><label>Tipo</label><select id="lt"><option value="D">Despesa</option><option value="R">Receita</option></select></div><div><label>Data</label><input id="ld" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Descrição</label><input id="ls"></div><div><label>Categoria</label><select id="lc">${opt(CATS)}</select></div><div><label>Valor total</label><input id="lv" inputmode="decimal" placeholder="0,00"></div><div><label>Conta / cartão</label><select id="la">${contasOpt()}</select></div><div><label>Parcelas</label><input id="lp" type="number" min="1" value="1"></div><button class="b" onclick="add()">Adicionar</button></div></div><div class="card">${L.map(l=>item(l)).join('')||'<p class="m">Nenhum lançamento neste mês.</p>'}</div>`;
 if(tab=='rec')h=`<div class="card"><b>Lançamentos recorrentes</b><p class="m">Cadastre uma vez: salário, financiamento (com nº de parcelas), luz, condomínio… Eles entram automaticamente todo mês.</p><div class="f"><div><label>Tipo</label><select id="rt"><option value="D">Despesa</option><option value="R">Receita</option></select></div><div><label>Descrição</label><input id="rs" placeholder="Ex.: Financiamento carro"></div><div><label>Categoria</label><select id="rc">${opt(CATS)}</select></div><div><label>Valor mensal</label><input id="rv" inputmode="decimal"></div><div><label>Dia do mês</label><input id="rd" type="number" min="1" max="31" value="5"></div><div><label>Conta / cartão</label><select id="ra">${contasOpt()}</select></div><div><label>Início</label><input id="ri" type="month" value="${ym}"></div><div><label>Nº parcelas (0 = sem fim)</label><input id="rp" type="number" min="0" value="0"></div><button class="b" onclick="addRec()">Salvar</button></div></div><div class="card">${db.rec.map(r=>`<div class="row"><div class="d"><b>${E(r.desc)}</b><span class="m">dia ${r.dia} · ${E(r.cat)} · desde ${r.inicio}${r.parcelas?' · '+r.parcelas+'x':' · sem fim'}</span></div><b class="${r.tipo=='R'?'g':'r'}">${fm(r.valor)}</b><button class="x" onclick="delRec('${r.id}')">✕</button></div>`).join('')||'<p class="m">Nada cadastrado.</p>'}</div>`;
 if(tab=='cart'){const sel=cf||db.contas[0].id,LL=L.filter(l=>l.conta==sel);h=monthBar()+`<div class="card"><div class="f"><div><label>Nome</label><input id="cnm" placeholder="Ex.: Nubank, Itaú Visa"></div><div><label>Tipo</label><select id="cty"><option>Cartão</option><option>Conta</option></select></div><button class="b" onclick="addConta()">Adicionar</button></div></div><div class="grid">${db.contas.map(c=>`<div class="card" style="cursor:pointer;${c.id==sel?'border-color:var(--a)':''}" onclick="cf='${c.id}';render()"><div class="m">${E(c.tipo=='Cartão'?'Fatura · ':'')}${E(c.nome)}</div><div class="big">${fm(sum(L.filter(l=>l.conta==c.id&&l.tipo=='D')))}</div></div>`).join('')}</div><div class="card"><b>${E(cn(sel))}</b>${LL.map(l=>item(l,0)).join('')||'<p class="m">Sem movimentos neste mês.</p>'}</div>`}
 if(tab=='imp')h=`<div class="card"><b>Importar fatura ou extrato</b><p class="m">Aceita CSV (Nubank, Inter, C6…) e OFX (Itaú, Bradesco, BB…). As categorias são sugeridas automaticamente e você revisa antes de confirmar. Duplicados são desmarcados.</p><div class="f"><div><label>Arquivo</label><input type="file" id="fi" accept=".csv,.ofx,.txt" onchange="readF(this)"></div><div><label>Lançar em</label><select id="ia">${contasOpt(db.contas.find(c=>c.tipo=='Cartão')?.id)}</select></div><div><label>Nos CSV, valor positivo é…</label><select id="im"><option value="pos">gasto (fatura de cartão)</option><option value="neg">entrada (extrato de conta)</option></select></div></div></div>${imp.length?`<div class="card sc"><table><tr><th></th><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr>${imp.map((x,i)=>`<tr><td><input type="checkbox" class="ck" ${x.inc?'checked':''} onchange="imp[${i}].inc=this.checked"></td><td>${x.data.split('-').reverse().join('/')}</td><td>${E(x.desc)}</td><td><select onchange="imp[${i}].cat=this.value">${opt(CATS,x.cat)}</select></td><td class="${x.tipo=='R'?'g':'r'}">${fm(x.valor)}</td></tr>`).join('')}</table><p><button class="b" onclick="confirmImp()">Importar selecionados</button></p></div>`:''}`;
 if(tab=='conta')h=`<div class="card"><b>Conta e sincronização</b>${user?`<p>Conectado como <b>${E(user.name)}</b><br><span class="m">${E(user.email)}</span></p><p><button class="b" onclick="sync()">Sincronizar agora</button> <button class="b s" onclick="logout()">Sair</button></p>`:`<p class="m">Modo local: dados somente neste aparelho.</p><p><button class="b" onclick="gAuth(sync)">Entrar com Google e ativar sincronização</button></p>`}<p class="m">Os dados vão para a pasta oculta do app no seu Google Drive (escopo drive.appdata), sem acesso aos seus outros arquivos. Quando conectado, sincroniza sozinho 3 segundos após cada alteração. Conflitos são resolvidos por registro (vale a alteração mais recente).</p></div>`;
 if(tab=='bkp')h=`<div class="card"><b>Backup e dados</b><p class="m">Os dados ficam salvos neste aparelho. Use o backup JSON para levar tudo do Windows para o Android (e vice-versa).</p><p><button class="b" onclick="expJ()">Baixar backup (.json)</button> <button class="b s" onclick="expC()">Exportar CSV</button></p><label>Restaurar backup</label><input type="file" accept=".json" onchange="impJ(this)"><p><button class="b s" onclick="if(confirm('Apagar TODOS os dados?')){localStorage.removeItem('fin');location.reload()}">Apagar tudo</button></p></div>`;
 $('app').innerHTML=h}
function add(){const v=num($('lv').value),n=+$('lp').value||1,d=$('ld').value,s=$('ls').value.trim();if(!(v>0)||!d||!s)return alert('Preencha data, descrição e valor.');const each=Math.round(v/n*100)/100;
 for(let i=0;i<n;i++){const dd=dIn(addM(d.slice(0,7),i),+d.slice(8));db.lanc.push({id:uid(),data:dd,tipo:$('lt').value,cat:$('lc').value,desc:s+(n>1?` (${i+1}/${n})`:''),valor:i==n-1?Math.round((v-each*(n-1))*100)/100:each,conta:$('la').value,pago:false,ref:null})}
 save();render()}
function tog(id){const l=db.lanc.find(x=>x.id==id);l.pago=!l.pago;l.t=0;save();render()}
function del(id){const l=db.lanc.find(x=>x.id==id);if(!confirm('Excluir "'+l.desc+'"?'))return;if(l.ref)db.skip.push(l.ref);db.del[id]=Date.now();db.lanc=db.lanc.filter(x=>x.id!=id);save();render()}
function addRec(){const v=num($('rv').value),s=$('rs').value.trim();if(!(v>0)||!s)return alert('Preencha descrição e valor.');db.rec.push({id:uid(),tipo:$('rt').value,desc:s,cat:$('rc').value,valor:v,dia:+$('rd').value||1,conta:$('ra').value,inicio:$('ri').value||ym,parcelas:+$('rp').value||0});save();render()}
function delRec(id){if(!confirm('Remover esta recorrência e os lançamentos futuros não pagos?'))return;const T=Date.now();db.del[id]=T;db.lanc.filter(l=>l.rec==id&&!l.pago).forEach(l=>db.del[l.id]=T);db.rec=db.rec.filter(r=>r.id!=id);db.lanc=db.lanc.filter(l=>l.rec!=id||l.pago);save();render()}
function addConta(){const n=$('cnm').value.trim();if(!n)return;db.contas.push({id:uid(),nome:n,tipo:$('cty').value});save();render()}
function setOrc(c){const v=prompt('Limite mensal para "'+c+'" (vazio remove):',db.orc[c]||'');if(v===null)return;const n=num(v);if(n>0)db.orc[c]=n;else delete db.orc[c];db.orcT=Date.now();save();render()}
function csvP(t){const l1=t.split('\n')[0],d=(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?';':',',rows=[];let r=[],c='',q=false;for(const ch of t){if(q){if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
function readF(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const t=rd.result,out=[];
 if(/<STMTTRN>/i.test(t)){const tg=(b,k)=>(b.match(new RegExp('<'+k+'>([^<\\r\\n]*)','i'))||[])[1]||'';(t.match(/<STMTTRN>[\s\S]*?(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>)/gi)||[]).forEach(b=>out.push({data:pdate(tg(b,'DTPOSTED')),desc:(tg(b,'MEMO')||tg(b,'NAME')).trim(),v:num(tg(b,'TRNAMT')),ofx:1}))}
 else{const rows=csvP(t),h=rows[0].map(x=>x.toLowerCase()),di=h.findIndex(x=>/data|date/.test(x)),vi=h.findIndex(x=>/valor|amount|value/.test(x)),ti=h.findIndex(x=>/descri|title|hist|estabelec|lan[cç]amento/.test(x));if(di<0||vi<0||ti<0)return alert('Não encontrei as colunas data, descrição e valor no cabeçalho do CSV.');rows.slice(1).forEach(r=>{if(r.length>vi)out.push({data:pdate(r[di]||''),desc:(r[ti]||'').trim(),v:num(r[vi])})})}
 const ac=$('ia').value,pos=$('im').value=='pos';
 imp=out.filter(x=>x.data&&!isNaN(x.v)&&x.desc).map(x=>{const exp=x.ofx?x.v<0:(pos?x.v>0:x.v<0),val=Math.abs(x.v),dup=db.lanc.some(l=>l.data==x.data&&l.valor==val&&l.desc==x.desc&&l.conta==ac);return{data:x.data,desc:x.desc,valor:val,tipo:exp?'D':'R',cat:exp?guess(x.desc):'Outras receitas',inc:!dup&&!/pagamento/i.test(x.desc)}});
 if(!imp.length)alert('Nenhum lançamento reconhecido.');render()};rd.readAsText(f,'utf-8')}
function confirmImp(){const ac=$('ia').value;imp.filter(x=>x.inc).forEach(x=>db.lanc.push({id:uid(),data:x.data,tipo:x.tipo,cat:x.cat,desc:x.desc,valor:x.valor,conta:ac,pago:true,ref:null}));const n=imp.filter(x=>x.inc).length;imp=[];save();alert(n+' lançamentos importados.');tab='lanc';render()}
function dl(n,c,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function expJ(){dl('backup_financeiro_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db),'application/json')}
function expC(){dl('lancamentos.csv','\ufeffData;Tipo;Categoria;Descrição;Conta;Valor;Pago\n'+db.lanc.sort((a,b)=>a.data<b.data?-1:1).map(l=>[l.data,l.tipo=='R'?'Receita':'Despesa',l.cat,l.desc,cn(l.conta),String(l.valor).replace('.',','),l.pago?'Sim':'Não'].join(';')).join('\n'),'text/csv')}
function impJ(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.lanc||!d.contas)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){db=d;db.del=db.del||{};db.skip=db.skip||[];db.orc=db.orc||{};save();render()}}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
const CLIENT_ID='1080175065304-5abpt6lar5at408l5pvfie3mi8o7kskc.apps.googleusercontent.com';
let syncSt='Sincronizar',pend=null,tc,user=JSON.parse(localStorage.getItem('fin_u')||'null');
const API='https://www.googleapis.com/drive/v3/files',UP='https://www.googleapis.com/upload/drive/v3/files';
function loginScr(){return`<div class="card" style="max-width:420px;margin:12vh auto;text-align:center"><div class="big">💰 Meu Controle Financeiro</div><p class="m">Entre para sincronizar seus dados entre Windows e Android pelo Google Drive.</p><p><button class="b" style="width:100%" onclick="gAuth(sync)">Entrar com Google</button></p><p><button class="b s" style="width:100%" onclick="localStorage.setItem('fin_local','1');render()">Usar apenas neste aparelho</button></p></div>`}
function gAuth(cb){
 if(location.protocol=='file:')return alert('O login Google não funciona abrindo o arquivo direto. Hospede o arquivo (GitHub Pages, grátis) e abra pelo endereço https://…');
 if(CLIENT_ID.startsWith('COLE')||!window.google)return alert('Configure o CLIENT_ID no topo do bloco de sincronização (veja as instruções) e verifique a internet.');
 pend=cb;tc=tc||google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'openid email profile https://www.googleapis.com/auth/drive.appdata',callback:async r=>{if(r.error)return alert('Erro de login: '+r.error);tok=r.access_token;tokExp=Date.now()+r.expires_in*1000-60000;try{const u=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}})).json();user={name:u.name,email:u.email};localStorage.setItem('fin_u',JSON.stringify(user))}catch(e){}const f=pend;pend=null;f?f():render()}});
 tc.requestAccessToken({prompt:user?'':'select_account'})}
function logout(){localStorage.removeItem('fin_u');user=null;tok=null;syncSt='Sincronizar';render()}
function merge(a,b){const del={...b.del};for(const k in a.del)del[k]=Math.max(del[k]||0,a.del[k]);
 const m=(x=[],y=[])=>{const mp=new Map();[...x,...y].forEach(r=>{const o=mp.get(r.id);if(!o||(r.t||0)>(o.t||0))mp.set(r.id,r)});return[...mp.values()].filter(r=>!(del[r.id]>(r.t||0)))};
 return{contas:m(a.contas,b.contas),lanc:m(a.lanc,b.lanc),rec:m(a.rec,b.rec),skip:[...new Set([...(a.skip||[]),...(b.skip||[])])],orc:(a.orcT||0)>=(b.orcT||0)?a.orc:(b.orc||{}),orcT:Math.max(a.orcT||0,b.orcT||0),del}}
async function sync(){
 if(!tok||Date.now()>tokExp)return gAuth(sync);
 syncSt='Sincronizando…';render();
 try{const H={Authorization:'Bearer '+tok},ck=async r=>{if(!r.ok)throw new Error((await r.text()).slice(0,150));return r};
  const j=await(await ck(await fetch(API+'?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='financas.json'"),{headers:H}))).json();const id=j.files[0]?.id;
  if(id){const d=await(await ck(await fetch(API+'/'+id+'?alt=media',{headers:H}))).json();db=merge(db,d);store()}
  const body=JSON.stringify(db);
  if(id)await ck(await fetch(UP+'/'+id+'?uploadType=media',{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body}));
  else{const bd='fin'+uid();await ck(await fetch(UP+'?uploadType=multipart',{method:'POST',headers:{...H,'Content-Type':'multipart/related; boundary='+bd},body:`--${bd}\r\nContent-Type: application/json\r\n\r\n{"name":"financas.json","parents":["appDataFolder"]}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`}))}
  syncSt='OK '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){syncSt='Erro de sync';alert('Falha na sincronização: '+e.message)}
 render()}
function proj(m){let R=0,D=0;db.lanc.filter(l=>l.data.startsWith(m)).forEach(l=>l.tipo=='R'?R+=l.valor:D+=l.valor);db.rec.forEach(r=>{if(m<r.inicio)return;const n=diff(r.inicio,m)+1;if(r.parcelas&&n>r.parcelas)return;const ref=r.id+'|'+m;if(db.skip.includes(ref)||db.lanc.some(l=>l.ref===ref))return;r.tipo=='R'?R+=r.valor:D+=r.valor});return[R,D]}
function projCard(){let s=0;return`<div class="card sc"><b>Projeção dos próximos 6 meses</b> <span class="m">(recorrentes + parcelas já lançadas)</span><table><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Saldo</th><th>Acumulado</th></tr>${[1,2,3,4,5,6].map(i=>{const m=addM(ym,i),[R,D]=proj(m);s+=R-D;return`<tr><td style="text-transform:capitalize">${mname(m)}</td><td class="g">${fm(R)}</td><td class="r">${fm(D)}</td><td>${fm(R-D)}</td><td class="${s<0?'r':''}">${fm(s)}</td></tr>`}).join('')}</table></div>`}
render();
</script><script src="https://accounts.google.com/gsi/client" async defer></script><script>if('serviceWorker'in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js')</script></body></html>
